<div class="wrap">
  <div class="page-head">
    <h1>💬 留言板</h1>
    <div class="sub">想发就发的小气泡，会在上面飘来飘去～ 点气泡看全文，想匿名就匿名。</div>
  </div>

  <div class="card composer" style="margin-bottom:20px">
    <div class="c-row">
      <div class="c-avatar" id="myAvatar" style="width:44px;height:44px;border-radius:15px;display:flex;align-items:center;justify-content:center;font-size:22px"></div>
      <div class="c-main">
        <textarea class="textarea" id="msgText" maxlength="120" placeholder="说点什么吧～（比如：谁的高数作业写完了，在线等）" style="min-height:70px"></textarea>
        <div class="c-tools">
          <label class="switch"><input type="checkbox" id="msgAnon"><span class="track"></span>匿名飘出</label>
          <span class="small muted" id="counter">0 / 120</span>
          <span class="spacer"></span>
          <button class="btn" id="msgSend">发射气泡 🫧</button>
        </div>
      </div>
    </div>
  </div>

  <div class="bubble-pool" id="bubblePool"></div>

  <h3 style="margin:26px 0 6px;font-size:18px">📜 全部留言</h3>
  <div class="msg-list card" id="msgList" style="padding:8px 20px"></div>
</div>

<footer class="footer"><b>无穹55 · 小窝</b> — 由全班一起搭建 🏠</footer>

<script src="js/common.js"></script>
<script src="js/api.js"></script>
<script src="js/seed.js"></script>
<script>
/* ---------- 留言板逻辑 ---------- */
function renderAvatar(){
  const me = ensureMe(false);
  const el = document.getElementById('myAvatar');
  el.textContent = me ? WQ.avatarOf(me.name) : '👻';
  el.style.cssText += WQ.pastelOf(me ? me.name : 'x');
}

document.getElementById('msgText').addEventListener('input', e =>
  document.getElementById('counter').textContent = `${e.target.value.length} / 120`);

document.getElementById('msgSend').onclick = () => {
  const me = ensureMe();
  if (!me) return;
  const text = document.getElementById('msgText').value.trim();
  const anon = document.getElementById('msgAnon').checked;
  if (!text) { toast('气泡里得有点字呀～'); return; }
  const msgs = WQ.get('messages', []);
  msgs.push({ id: WQ.uid(), text, by: anon ? null : me.name, anon, ts: Date.now() });
  WQ.set('messages', msgs);
  document.getElementById('msgText').value = '';
  document.getElementById('counter').textContent = '0 / 120';
  document.getElementById('msgAnon').checked = false;
  renderBubbles(); renderList();
  emojiBurst(['🫧', '💬', '✨']);
  toast(anon ? '匿名气泡飘出去了 🕵️' : '气泡发射成功！🫧');
};

/* ---- 流动气泡引擎：缓缓上浮 + 蛇形漂移 + 穿边循环 ---- */
let bubAnim = null;   // rAF 句柄
let bubData = [];     // 每个气泡的运动状态

function stopBubLoop(){ if (bubAnim) cancelAnimationFrame(bubAnim); bubAnim = null; }
function startBubLoop(){
  if (bubAnim || !bubData.length || document.hidden) return;  // 后台标签页不启动，回前台再续
  const pool = document.getElementById('bubblePool');
  let last = performance.now();
  const step = t => {
    const dt = Math.min(60, t - last) / 1000; last = t;
    const W = pool.clientWidth, H = pool.clientHeight;
    for (const b of bubData) {
      const slow = b.hover ? .25 : 1;                    // 悬停时减速，方便点开阅读
      b.phase += b.swaySpeed * dt * slow;
      b.x += (b.vx + Math.cos(b.phase) * b.sway) * dt * slow;
      b.y += b.vy * dt * slow;
      b.rot += b.vr * dt * slow;
      if (b.rot > 6 || b.rot < -6) b.vr *= -1;
      b.scale += ((b.hover ? 1.09 : 1) - b.scale) * .12;
      const w = b.el.offsetWidth, h = b.el.offsetHeight;
      if (b.x < -w - 30) b.x = W + 20; else if (b.x > W + 30) b.x = -w - 20;
      if (b.y < -h - 30) b.y = H + 20; else if (b.y > H + 40) b.y = -h - 20;
      b.el.style.transform = `translate(${b.x.toFixed(1)}px,${b.y.toFixed(1)}px) rotate(${b.rot.toFixed(2)}deg) scale(${b.scale.toFixed(3)})`;
    }
    bubAnim = requestAnimationFrame(step);
  };
  bubAnim = requestAnimationFrame(step);
}

function openMsgModal(id){
  const m = WQ.get('messages', []).find(x => x.id === id);
  if (!m) return;
  const mask = document.createElement('div');
  mask.className = 'modal-mask show';
  mask.innerHTML = `<div class="modal">
    <div style="font-size:15.5px;line-height:1.9;padding:6px 2px;white-space:pre-wrap;word-break:break-all">${WQ.esc(m.text)}</div>
    <div class="small muted" style="text-align:right;margin-top:10px">${m.anon ? '🕵️ 匿名同学' : WQ.esc(m.by)} · ${WQ.fmt(m.ts)}</div>
    <div class="m-actions"><button class="btn ghost" id="bubClose">关掉</button></div>
  </div>`;
  document.body.appendChild(mask);
  mask.addEventListener('click', e => { if (e.target === mask) mask.remove(); });
  mask.querySelector('#bubClose').onclick = () => mask.remove();
}

function renderBubbles(){
  const pool = document.getElementById('bubblePool');
  const msgs = WQ.get('messages', []).slice().sort((a,b) => b.ts - a.ts).slice(0, 12);
  stopBubLoop();
  pool.innerHTML = '';
  bubData = [];
  const W = pool.clientWidth || 1000, H = pool.clientHeight || 420;
  // 初始用网格槽位散开（避免刚加载就叠在一起），随后自由流动
  const cols = Math.max(3, Math.floor(W / 240)), rows = 3;
  const slots = [];
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) slots.push([r, c]);
  slots.sort(() => Math.random() - .5);
  msgs.forEach((m, i) => {
    const el = document.createElement('div');
    el.className = 'bub';
    el.style.cssText = WQ.pastelOf(m.id + m.by);
    const short = m.text.length > 42 ? m.text.slice(0, 40) + '…' : m.text;
    el.innerHTML = `${WQ.esc(short)}<span class="who">${m.anon ? '🕵️ 匿名' : WQ.esc(m.by)}</span>`;
    el.style.zIndex = 2 + (i % 3);
    pool.appendChild(el);
    const [sr, sc] = slots[i % slots.length];
    const b = {
      el, hover: false, scale: 1,
      x: i === 0 ? W / 2 - 90 : (sc + .1 + Math.random() * .4) / cols * W,   // 最新一条从底部升起
      y: i === 0 ? H + 14    : (sr + .15 + Math.random() * .4) / rows * H,
      vx: (15 + Math.random() * 18) * (Math.random() < .5 ? -1 : 1),
      vy: -(8 + Math.random() * 8),
      sway: 18 + Math.random() * 20, swaySpeed: .5 + Math.random() * .6,
      phase: Math.random() * Math.PI * 2,
      rot: (Math.random() - .5) * 5, vr: (Math.random() - .5) * 1.2,
    };
    el.addEventListener('mouseenter', () => b.hover = true);
    el.addEventListener('mouseleave', () => b.hover = false);
    el.addEventListener('click', () => openMsgModal(m.id));
    // 立即落位（即使页面在后台、动画未启动，气泡也是散开状态而非堆在角落）
    el.style.transform = `translate(${b.x.toFixed(1)}px,${b.y.toFixed(1)}px) rotate(${b.rot.toFixed(2)}deg)`;
    bubData.push(b);
  });
  startBubLoop();
}

/* 页面切到后台时暂停流动，回来继续（省电） */
document.addEventListener('visibilitychange', () => {
  if (document.hidden) stopBubLoop();
  else startBubLoop();
});

/* ---- 列表 ---- */
function renderList(){
  const msgs = WQ.get('messages', []).slice().sort((a,b) => b.ts - a.ts);
  const box = document.getElementById('msgList');
  if (!msgs.length){ box.innerHTML = `<div class="empty"><span class="e-ico">💬</span>还没有留言，发第一条！</div>`; return; }
  box.innerHTML = msgs.map(m => `
    <div class="msg-item">
      <div class="m-avatar" style="${WQ.pastelOf(m.id + m.by)}">${m.anon ? '🕵️' : WQ.avatarOf(m.by)}</div>
      <div class="m-body">
        <div class="m-meta"><b>${m.anon ? '匿名同学' : WQ.esc(m.by)}</b><span>${WQ.fmt(m.ts)}</span>
          <button class="act" style="padding:2px 8px;font-size:12px" data-del="${m.id}">删除</button>
        </div>
        <div class="m-text">${WQ.esc(m.text)}</div>
      </div>
    </div>`).join('');
  box.querySelectorAll('[data-del]').forEach(b => b.onclick = () => {
    if (!confirm('删掉这条留言？')) return;
    WQ.set('messages', WQ.get('messages', []).filter(x => x.id !== b.dataset.del));
    renderBubbles(); renderList(); toast('已删除 🗑️');
  });
}

let rsT;
window.addEventListener('resize', () => { clearTimeout(rsT); rsT = setTimeout(renderBubbles, 300); });

renderAvatar(); renderBubbles(); renderList();
window.__wqRerender = () => { renderBubbles(); renderList(); };
</script>
